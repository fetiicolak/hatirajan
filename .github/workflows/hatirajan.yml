name: HatırAjan

on:
  schedule:
    # Saatte 2 kez. GitHub zamanlanmış çalıştırmaları atlayabildiği için 08:00/17:00 (TR) taraması
    # sabit bir cron'a bağlı değil: "otomatik" işlem, vakti geçmiş ve yapılmamış taramayı telafi eder.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      islem:
        description: "Ne yapılsın?"
        type: choice
        default: kontrol
        options: [kontrol, hatirlat, ozet, test-telegram]

permissions:
  contents: write

concurrency:
  group: hatirajan
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          # yalnızca bir kaynak "tarayici": true isterse Playwright kurulur
          if grep -q '"tarayici": *true' config/gorevler.json; then
            pip install playwright && playwright install --with-deps chromium
          fi

      - name: Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISLEM="${{ inputs.islem }}"
          else
            ISLEM=otomatik
          fi
          echo "İşlem: $ISLEM"
          python -m hatirajan "$ISLEM"

      - name: Durumu kaydet
        run: |
          git config user.name "hatirajan-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -d data ] || exit 0   # test-telegram gibi işlemler durum dosyası yazmaz
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Durum güncellemesi: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # panel aynı anda config'i değiştirmiş olabilir: yeniden dene
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
